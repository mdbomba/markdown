[project]
name = "loadmaster-mcp"
version = "2.0.0"
description = "MCP server for Kemp LoadMaster - documentation, live queries, and configuration management"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
loadmaster-mcp = "loadmaster_mcp.server:main"
